name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # 代码质量检查
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Check commit format
      run: |
        python3 << 'EOF'
        import re
        import subprocess
        import os
        
        base = os.environ.get('GITHUB_BASE_REF', 'main')
        head = os.environ.get('GITHUB_HEAD_REF', 'HEAD')
        
        # Skip for develop -> main merges
        if base == 'main' and head == 'develop':
            print("⏭️ Skipping commit lint for develop → main merge")
            exit(0)
        
        # Get commits
        result = subprocess.run(
            ['git', 'log', f'origin/{base}..origin/{head}', '--pretty=format:%s'],
            capture_output=True, text=True
        )
        commits = result.stdout.strip().split('\n') if result.stdout.strip() else []
        
        # Pattern - scope must be in parentheses like (factor)
        valid_types = 'feat|fix|docs|style|refactor|test|chore|revert|perf|ci|build'
        valid_scopes = 'combat|cycle|factor|material|technology|quest|creature|loot|cultivation|ui|network|multiblock|command|config|api|core'
        pattern = rf'^({valid_types})(\(({valid_scopes})\))?:\s.+'
        
        print("Checking commit messages...\n")
        failed = False
        
        for commit in commits:
            # Skip merge commits and version tags
            if commit.startswith(('Merge branch', 'Merge pull', 'Merge PR:', 'v')):
                continue
            
            if re.match(pattern, commit, re.UNICODE):
                print(f"✅ Valid:   {commit}")
            else:
                print(f"❌ Invalid: {commit}")
                failed = True
        
        if failed:
            print("\nCommit message format requirements:")
            print("  Format: <type>(<scope>): <subject>")
            print("  Types: feat, fix, docs, style, refactor, test, chore, revert, perf, ci, build")
            print("  Scopes (optional): combat, cycle, factor, material, technology, quest, creature, loot, cultivation, ui, network, multiblock, command, config, api, core")
            exit(1)
        
        print("\n✅ All commits follow the format!")
        EOF
      env:
        GITHUB_BASE_REF: ${{ github.base_ref }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}

  # 编译和测试
  build-and-test:
    runs-on: ubuntu-latest
    needs: lint
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Cache Fabric Loom
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches/fabric-loom
          ~/.gradle/caches/modules-2/files-2.1/net.fabricmc
        key: fabric-loom-${{ hashFiles('gradle.properties') }}
        restore-keys: |
          fabric-loom-
    
    - name: Build with Gradle
      run: ./gradlew build --no-daemon
    
    - name: Run Unit Tests
      run: ./gradlew test --no-daemon
    
    - name: Run Quick Test
      run: ./gradlew runQuickTest --no-daemon
    
    - name: Run GameTest
      run: ./gradlew runGametest --no-daemon
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ github.run_id }}
        path: |
          build/reports/
          build/gametest/
          logs/
        retention-days: 7
    
    - name: Upload Build Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: factor-craft-${{ github.run_id }}
        path: build/libs/*.jar
        retention-days: 7

  # 汇总检查结果
  checks:
    runs-on: ubuntu-latest
    needs: [lint, build-and-test]
    if: always()
    
    steps:
    - name: Check all jobs
      if: needs.lint.result == 'failure' || needs.build-and-test.result == 'failure'
      run: exit 1
    
    - name: All checks passed
      if: needs.lint.result != 'failure' && needs.build-and-test.result != 'failure'
      run: echo "✅ All CI checks passed!"
