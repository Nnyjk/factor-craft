name: Commit Lint

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up locale
      run: |
        sudo locale-gen en_US.UTF-8
        sudo locale-gen C.UTF-8
        echo "LANG=C.UTF-8" >> $GITHUB_ENV
        echo "LC_ALL=C.UTF-8" >> $GITHUB_ENV
    
    - name: Check commit format
      run: |
        # Get the base branch
        BASE="${{ github.base_ref }}"
        HEAD="${{ github.head_ref }}"
        
        # Skip lint for develop -> main merges (historical commits)
        if [[ "$BASE" == "main" && "$HEAD" == "develop" ]]; then
          echo "⏭️ Skipping commit lint for develop → main merge (historical commits)"
          exit 0
        fi
        
        # Get all commits in the PR
        COMMITS=$(git log origin/$BASE..origin/$HEAD --pretty=format:"%s")
        
        # Valid types
        VALID_TYPES="feat|fix|docs|style|refactor|test|chore|revert|perf|ci|build"
        
        # Valid scopes
        VALID_SCOPES="combat|cycle|factor|material|technology|quest|creature|loot|cultivation|ui|network|multiblock|command|config|api|core"
        
        # Pattern (allow optional PR reference suffix like "(PR #41)")
        # Use [[:space:]] for better locale support
        PATTERN="^($VALID_TYPES)(\($VALID_SCOPES\))?:[[:space:]].+(\s\(PR\s#[0-9]+\))?$"
        
        FAILED=0
        
        echo "Checking commit messages..."
        echo ""
        
        while IFS= read -r COMMIT; do
          # Skip merge commits
          if [[ "$COMMIT" =~ ^Merge\ branch|^Merge\ pull\ request|^Merge\ PR: ]]; then
            continue
          fi
          
          # Skip version tags
          if [[ "$COMMIT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            continue
          fi
          
          if [[ ! "$COMMIT" =~ $PATTERN ]]; then
            echo "❌ Invalid: $COMMIT"
            FAILED=1
          else
            echo "✅ Valid:   $COMMIT"
          fi
        done <<< "$COMMITS"
        
        echo ""
        
        if [ $FAILED -eq 1 ]; then
          echo ""
          echo "Commit message format requirements:"
          echo "  Format: <type>(<scope>): <subject>"
          echo "  Types: feat, fix, docs, style, refactor, test, chore, revert, perf, ci, build"
          echo "  Scopes (optional): combat, cycle, factor, material, technology, quest, creature, loot, cultivation, ui, network, multiblock, command, config, api, core"
          echo ""
          echo "Examples:"
          echo "  feat(combat): add T6 weapon system"
          echo "  fix: resolve registration issue"
          echo "  docs: update installation guide"
          exit 1
        fi
        
        echo "✅ All commits follow the format!"