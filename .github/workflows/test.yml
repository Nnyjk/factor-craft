name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Cache Fabric Loom
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches/fabric-loom
          ~/.gradle/caches/modules-2/files-2.1/net.fabricmc
        key: fabric-loom-${{ hashFiles('gradle.properties') }}
        restore-keys: |
          fabric-loom-
    
    - name: Build
      run: ./gradlew build
    
    - name: Quick Test
      run: ./gradlew runQuickTest
    
    - name: Game Test
      run: ./gradlew runGametest
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          build/reports/
          build/gametest/
          logs/